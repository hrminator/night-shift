app = "night-shift-demo"
primary_region = "arn"

[env]
  DATA_DIR = "/data"
  DAILY_CAP_USD = "5"
  RECORDED_JOB = "6c7c7c742513"
  RECORDED_JOB_B = "cde5841a68d2"
  # RUN_TOKEN is a secret, not an env: `fly secrets set RUN_TOKEN=...`.

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"

[[mounts]]
  source = "night_shift_data"
  destination = "/data"
  initial_size = "1GB"
