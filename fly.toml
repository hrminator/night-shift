app = "night-shift-demo"
primary_region = "arn"

[env]
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"

[[mounts]]
  source = "night_shift_data"
  destination = "/data"
  initial_size = "1GB"
